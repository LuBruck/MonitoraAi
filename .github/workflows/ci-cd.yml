# Pipeline do MonitoraAí
#
#   Build e testes ──► Entrega ──► Publicação (GitHub Pages)
#        (CI)            (CD)         (só na main + aprovação manual)
#
# Se "Build e testes" falhar, os jobs seguintes são pulados (skipped):
# nenhuma versão com teste quebrando é empacotada nem publicada.
name: CI/CD

on:
  # Todo push, em qualquer branch, roda o CI
  push:
    branches: ['**']
  # Todo Pull Request para a main roda o CI antes do merge
  pull_request:
    branches: [main]
  # Permite rodar manualmente pela aba Actions
  workflow_dispatch:

# Permissão padrão mínima: só leitura do código
permissions:
  contents: read

jobs:
  # ---------------------------------------------------------------- CI
  build-e-testes:
    name: Build e testes
    # Versão fixa do sistema: o ambiente do pipeline não muda sem a equipe saber
    runs-on: ubuntu-24.04

    steps:
      - name: Baixar o código do repositório
        uses: actions/checkout@v7

      - name: Configurar Node.js 22
        uses: actions/setup-node@v7
        with:
          node-version: 22
          cache: npm

      - name: Instalar dependências (exatamente as do package-lock.json)
        run: npm ci

      - name: Build (gera dist/ e verifica arquivos)
        run: npm run build

      - name: Testes automatizados (Jest)
        run: npm test -- --ci

      - name: Guardar o build como artefato
        uses: actions/upload-artifact@v7
        with:
          name: monitoraai-${{ github.sha }}
          path: dist/
          retention-days: 30

  # ---------------------------------------------------------------- CD: entrega
  entrega:
    name: Entrega (prepara versão para publicação)
    needs: build-e-testes          # só roda se o CI passou
    runs-on: ubuntu-24.04

    steps:
      - name: Baixar o build validado pelo CI
        uses: actions/download-artifact@v8
        with:
          name: monitoraai-${{ github.sha }}
          path: dist/

      - name: Empacotar o build no formato do GitHub Pages
        uses: actions/upload-pages-artifact@v5
        with:
          path: dist/

  # ---------------------------------------------------------------- CD: publicação
  publicacao:
    name: Publicação (GitHub Pages)
    needs: entrega                 # só roda se a entrega foi preparada
    # Publica apenas a partir da main (push/merge ou execução manual)
    if: github.ref == 'refs/heads/main' && github.event_name != 'pull_request'
    runs-on: ubuntu-24.04

    # O ambiente "github-pages" tem revisor obrigatório:
    # o job fica "Waiting" até alguém aprovar (Continuous Delivery).
    environment:
      name: github-pages
      url: ${{ steps.deploy.outputs.page_url }}

    # Só este job recebe permissão para publicar
    permissions:
      pages: write
      id-token: write

    # Evita duas publicações ao mesmo tempo
    concurrency:
      group: pages
      cancel-in-progress: false

    steps:
      - name: Publicar no GitHub Pages
        id: deploy
        uses: actions/deploy-pages@v5
